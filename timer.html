<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: 'Exo 2', monospace;
        }
        #timer {
            font-size: 80px;
            font-weight: bold;
            color: #919191;
        }
        /* Класс для скрытия таймера */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="timer">10</div>
    <script>
        // Получаем параметры из URL
        function getURLParams() {
            var params = new URLSearchParams(window.location.search);
            return {
                seconds: params.get('seconds'),
                hide: params.get('hide') // параметр для скрытия таймера
            };
        }
        
        var params = getURLParams();
        var el = document.getElementById('timer');
        
        // Обработка параметра seconds
        var totalSeconds = 10; // значение по умолчанию
        if (params.seconds && !isNaN(params.seconds)) {
            totalSeconds = Math.min(parseInt(params.seconds), 999);
        }
        
        var currentSeconds = totalSeconds;
        el.innerText = currentSeconds;
        
        // Обработка параметра hide
        // hide=1 или hide=true или hide=yes - скрыть таймер
        if (params.hide && (params.hide === '1' || params.hide === 'true' || params.hide === 'yes')) {
            el.classList.add('hidden');
        }
        
        // Запускаем таймер
        setInterval(function() {
            currentSeconds--;
            if (currentSeconds < 0) {
                currentSeconds = totalSeconds; // сброс до исходного значения
            }
            el.innerText = currentSeconds;
        }, 1000);
    </script>
</body>
</html>
